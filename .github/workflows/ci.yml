name: CareOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t careops-platform:ci .

      - name: Start container
        run: docker run -d --name careops-ci -p 127.0.0.1:8081:5000 careops-platform:ci

      - name: Check container health
        run: curl --fail --show-error --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 http://127.0.0.1:8081/health

      - name: Show container logs
        if: always()
        run: docker logs careops-ci

      - name: Clean up container
        if: always()
        run: docker rm -f careops-ci