apiVersion: apps/v1
kind: Deployment
metadata:
  name: careops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careops
  template:
    metadata:
      labels:
        app: careops
    spec:
      containers:
        - name: careops-app
          image: careops-platform:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3